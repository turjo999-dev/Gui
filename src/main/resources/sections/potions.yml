#
# potion-type accepts standard Bukkit PotionType names (e.g. SWIFTNESS, HEALING).
# It only affects items whose material is POTION, SPLASH_POTION, or LINGERING_POTION -
# it's ignored for anything else. Leaving it unset on a potion material gives the
# player a base/awkward-style potion with no effect, so every entry below sets one.

section:
  id: "potions"
  name: "Potions"
  display-name: "&5&l⚗ &d&lPOTIONS SECTION"
  icon: "POTION"
  description: "Brewed potions, splash potions and lingering clouds"
  permission: "easyshopgui.section.potions"
  enabled: true

items:
  # Drinkable Potions
  potion_swiftness:
    material: "POTION"
    potion-type: "SWIFTNESS"
    name: "&bPotion of Swiftness"
    buy-price: 40.0
